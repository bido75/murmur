name: trivy

# CVE / supply-chain scan of the whole filesystem (dependencies, lockfiles,
# configs, secrets-in-files), uploaded to the Security tab as SARIF.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "40 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only gate: critical deps are gated in the ci security job
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

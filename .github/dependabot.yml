version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security, desktop]
  - package-ecosystem: npm
    directory: "/zapier"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security, zapier]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]

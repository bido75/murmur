<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Murmur</title>
    <style>
      :root {
        --bg: #1b1e1c;
        --ink: #ecedea;
        --muted: #9aa09b;
        --accent: #5fc2a6;
        --danger: #f0674f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: transparent;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        margin: 8px;
        padding: 10px 12px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid #2b2f2c;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 6px;
        -webkit-app-region: drag;
      }
      .row { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
      .dot { width: 9px; height: 9px; border-radius: 5px; background: var(--danger); flex: 0 0 auto; }
      .time { font-variant-numeric: tabular-nums; }
      .spacer { flex: 1; }
      .meter { height: 4px; background: #2b2f2c; border-radius: 2px; overflow: hidden; }
      .meter > div { height: 100%; background: var(--accent); width: 0; transition: width .1s; }
      button {
        min-height: 28px; min-width: 28px;
        border-radius: 8px; border: 1px solid #2b2f2c;
        background: #242825; color: var(--ink);
        font-size: 12px; cursor: pointer; padding: 0 10px;
        -webkit-app-region: no-drag;
      }
      button:hover { background: #2b2f2c; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <span class="dot" id="dot"></span>
        <span class="time" id="time">0:00</span>
        <span class="spacer"></span>
        <button id="open" title="Open Murmur" aria-label="Open Murmur">Open</button>
        <button id="stop" title="Stop recording" aria-label="Stop recording">Stop</button>
      </div>
      <div class="meter"><div id="meter"></div></div>
    </div>
    <script>
      const time = document.getElementById("time");
      const meter = document.getElementById("meter");
      const stop = document.getElementById("stop");
      const open = document.getElementById("open");

      function clock(ms) {
        const s = Math.floor(ms / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        return `${mm}:${String(s % 60).padStart(2, "0")}`;
      }

      window.floating.onState((s) => {
        time.textContent = clock(s.elapsedMs || 0);
        meter.style.width = Math.round(Math.min(1, Math.max(0, (s.level + 60) / 60)) * 100) + "%";
      });

      stop.addEventListener("click", () => window.floating.stop());
      open.addEventListener("click", () => window.floating.open());
    </script>
  </body>
</html>

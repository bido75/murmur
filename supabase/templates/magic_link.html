<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in code</title>
  </head>
  <body style="margin:0;background:#F7F5F0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1A1C1A">
    <div style="max-width:520px;margin:0 auto;padding:32px 24px">
      <h1 style="font-size:20px;margin:0 0 8px">Your sign-in code</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 24px">
        Enter this code in Murmur to sign in. It works once and expires in an hour.
      </p>
      <p style="font-size:32px;letter-spacing:8px;font-weight:700;margin:0 0 24px;color:#1F6F5C">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.5;margin:0 0 8px;color:#6B6F6A">
        If the code does not work, open this link on the device you are signing in on:
        <a href="{{ .ConfirmationURL }}" style="color:#1F6F5C">{{ .ConfirmationURL }}</a>
      </p>
      <p style="font-size:12px;line-height:1.5;margin:24px 0 0;color:#6B6F6A">
        If you did not ask to sign in, you can ignore this message.
      </p>
    </div>
  </body>
</html>
